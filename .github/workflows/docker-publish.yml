name: Booky book store app CI/CD

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 0 1,6,11,16,21,26 * *"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Log in to Docker HUB
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule') }}
          tags: fraolbmax/booky-bookstore-app:latest

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull fraolbmax/booky-bookstore-app:latest
            docker stop booky-bookstore-app || true
            docker rm booky-bookstore-app || true
            docker run -d \
              --name booky-bookstore-app \
              --restart always \
              --network bookstore-mesh \
              -p 5000:5000 \
              --env-file /home/fraol/secrets/booky-bookstore-app.env \
              fraolbmax/booky-bookstore-app:latest
